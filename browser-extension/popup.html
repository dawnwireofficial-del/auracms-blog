<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DawnWire Importer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A1F44;
      color: #fff;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span { color: #FF8A00; }
    .subtitle { font-size: 11px; color: #8899bb; margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #8899bb; text-transform: uppercase; margin-bottom: 4px; margin-top: 12px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #1a3366;
      border-radius: 8px;
      background: #0D2A5C;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #246BFF; }
    input::placeholder { color: #445577; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #246BFF; color: #fff; }
    .btn-secondary { background: #1a3366; color: #8899bb; margin-top: 8px; font-size: 11px; }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .status.success { display: block; background: #0a3322; color: #33cc88; border: 1px solid #33cc8822; }
    .status.error { display: block; background: #330a0a; color: #ff4444; border: 1px solid #ff444422; }
    .status.info { display: block; background: #0a1a33; color: #4488ff; border: 1px solid #4488ff22; }
    .hint { font-size: 10px; color: #556688; margin-top: 3px; }
    .footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid #1a3366; font-size: 11px; color: #556688; text-align: center; }
    .footer a { color: #4488ff; text-decoration: none; }

    .import-status { margin-top: 8px; display: none; }
    .import-status.active { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #33cc88; }
    .spinner { width: 12px; height: 12px; border: 2px solid #33cc8833; border-top-color: #33cc88; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .queue-section { margin-top: 16px; display: none; }
    .queue-section.active { display: block; }
    .queue-header { font-size: 11px; font-weight: 600; color: #8899bb; text-transform: uppercase; margin-bottom: 8px; }
    .queue-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 10px; border-bottom: 1px solid #1a336633; }
    .queue-item:last-child { border-bottom: none; }
    .queue-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c0d0f0; }
    .queue-status { font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .queue-status.pending { background: #1a3366; color: #8899bb; }
    .queue-status.importing { background: #246BFF33; color: #4488ff; }
    .queue-status.done { background: #33cc8822; color: #33cc88; }
    .queue-status.failed { background: #ff444422; color: #ff4444; }
    .queue-progress {
      height: 3px;
      background: #1a3366;
      border-radius: 2px;
      overflow: hidden;
      margin: 8px 0;
    }
    .queue-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #246BFF, #4488ff);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
    .badge-amazon { background: #FF990022; color: #FF9900; }
    .badge-walmart { background: #0071DC22; color: #0071DC; }
    .badge-bestbuy { background: #FFCC0022; color: #FFCC00; }
  </style>
</head>
<body>
  <h1>&#9889; DawnWire <span>Importer</span></h1>
  <p class="subtitle">Multi-store product import for your website</p>

  <label>API URL</label>
  <input type="url" id="apiUrl" placeholder="https://dawnwire.com" />
  <p class="hint">Your DawnWire website URL</p>

  <label>API Token</label>
  <input type="password" id="apiToken" placeholder="Paste your admin token" />
  <p class="hint">Get this from Admin &rarr; Settings &rarr; Browser Extension API Token</p>

  <button id="saveBtn" class="btn btn-primary">Save Settings</button>
  <button id="testBtn" class="btn btn-secondary">Test Connection</button>

  <div id="status" class="status"></div>

  <div id="connIndicator" style="display:none;align-items:center;gap:6px;font-size:10px;color:#8899bb;margin-top:8px;">
    <span id="connDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;"></span>
    <span id="connText">Not tested</span>
  </div>

  <div id="importStatus" class="import-status">
    <div class="spinner"></div>
    <span>Import in progress...</span>
  </div>

  <div id="queueSection" class="queue-section">
    <div class="queue-header">Import Queue</div>
    <div class="queue-progress">
      <div id="queueProgressFill" class="queue-progress-fill"></div>
    </div>
    <div id="queueList"></div>
  </div>

  <div class="footer">
    <a href="https://dawnwire.com" target="_blank">DawnWire</a> &middot; v2.0.0 &middot;
    <span style="color:#556688">Amazon, Walmart, Best Buy, AliExpress, eBay</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
