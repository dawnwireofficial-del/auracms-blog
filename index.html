      :root {
        --dw-cursor-ring-size: 36px;

        --dw-cursor-accent: #D4B87A;
      }
      .dw-cursor-wrap {
        position: fixed;
        top: 0; left: 0;
        z-index: 10000;
        pointer-events: none;
        opacity: 0;
        will-change: transform;
      }
      .dw-cursor-ring {
        position: fixed;
        top: calc(var(--dw-cursor-ring-size) / -2);
        left: calc(var(--dw-cursor-ring-size) / -2);
        width: var(--dw-cursor-ring-size);
        height: var(--dw-cursor-ring-size);
        border-radius: 9999px;
        border: 1.5px solid var(--dw-cursor-color);
        opacity: 0.55;
        transition: width 0.28s var(--dw-cursor-ring-ease), height 0.28s var(--dw-cursor-ring-ease),
                    border-color 0.28s ease, background-color 0.28s ease, opacity 0.28s ease;
        will-change: transform;
      }
      .dw-cursor-dot {
        position: fixed;
        top: calc(var(--dw-cursor-dot-size) / -2);
        left: calc(var(--dw-cursor-dot-size) / -2);
        width: var(--dw-cursor-dot-size);
        height: var(--dw-cursor-dot-size);
        border-radius: 9999px;
        background: var(--dw-cursor-color);
        box-shadow: 0 0 10px rgba(36, 107, 255, 0.6);
        will-change: transform;
      }
      .dw-cursor-hover .dw-cursor-ring {
        width: 56px;
        height: 56px;
        background: rgba(36, 107, 255, 0.08);
        border-color: var(--dw-cursor-accent);
        opacity: 0.9;
      }
      .dw-cursor-hover .dw-cursor-dot {
        background: var(--dw-cursor-accent);
