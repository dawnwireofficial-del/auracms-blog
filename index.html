    <div id="dawn-loader" style="position:fixed;inset:0;z-index:9999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease">
      <style>
        @keyframes dw-orbit-a { from { transform: rotate(0deg) translateX(52px) rotate(0deg); } to { transform: rotate(360deg) translateX(52px) rotate(-360deg); } }
        @keyframes dw-orbit-b { from { transform: rotate(360deg) translateX(34px) rotate(-360deg); } to { transform: rotate(0deg) translateX(34px) rotate(0deg); } }
        @keyframes dw-core-pulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(36,107,255,0.35)); } 50% { transform: scale(1.07); filter: drop-shadow(0 0 26px rgba(255,138,0,0.45)); } }
        @keyframes dw-word-shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes dw-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dw-track { 0% { left: -40%; width: 40%; } 50% { left: 30%; width: 45%; } 100% { left: 100%; width: 40%; } }
        .dw-loader-stage { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
        .dw-loader-core { width: 74px; height: 74px; object-fit: contain; animation: dw-core-pulse 2.2s ease-in-out infinite; border-radius: 18px; }
        .dw-orbit-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(36,107,255,0.12); }
