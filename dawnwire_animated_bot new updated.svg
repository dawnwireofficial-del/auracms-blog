<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1536" width="1024" height="1536" role="img" aria-labelledby="title desc">
  <title id="title">Animated Dawnwire D Bot</title>
  <desc id="desc">A glossy blue and white floating robot mascot with cat-like ears, glowing blinking eyes, animated arms, body, ears, chest D emblem, and thruster.</desc>
  <defs>
    <!-- Core gradients -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#e9f3ff"/>
      <stop offset="0.7" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#a7c9ff"/>
    </linearGradient>
    <linearGradient id="shellShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#8fbaff"/>
    </linearGradient>
    <linearGradient id="blueMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07106a"/>
      <stop offset="0.22" stop-color="#1337dd"/>
      <stop offset="0.48" stop-color="#048cff"/>
      <stop offset="0.7" stop-color="#1535da"/>
      <stop offset="1" stop-color="#050953"/>
    </linearGradient>
    <linearGradient id="blueMetalReverse" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07106a"/>
      <stop offset="0.25" stop-color="#1943ec"/>
      <stop offset="0.54" stop-color="#08a9ff"/>
      <stop offset="0.78" stop-color="#1640df"/>
      <stop offset="1" stop-color="#060a55"/>
    </linearGradient>
    <radialGradient id="visor" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0a3dcf"/>
      <stop offset="0.48" stop-color="#06177f"/>
      <stop offset="1" stop-color="#02083b"/>
    </radialGradient>
    <radialGradient id="eye" cx="38%" cy="32%" r="66%">
      <stop offset="0" stop-color="#dfffff"/>
      <stop offset="0.22" stop-color="#77fbff"/>
      <stop offset="0.68" stop-color="#16d9ff"/>
      <stop offset="1" stop-color="#00a2ee"/>
    </radialGradient>
    <linearGradient id="earBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd77c8"/>
      <stop offset="0.18" stop-color="#5d51ff"/>
      <stop offset="0.52" stop-color="#0f7cff"/>
      <stop offset="1" stop-color="#0a0f73"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecf6ff"/>
      <stop offset="0.45" stop-color="#57d9ff"/>
      <stop offset="1" stop-color="#696eff"/>
    </linearGradient>
    <linearGradient id="thruster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ffff"/>
      <stop offset="0.3" stop-color="#86efff"/>
      <stop offset="0.7" stop-color="#1d9cff"/>
      <stop offset="1" stop-color="#4f45ec"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9ffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinkBlueRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8ed7"/>
      <stop offset="0.48" stop-color="#4bdfff"/>
      <stop offset="1" stop-color="#3374ff"/>
    </linearGradient>
    <!-- Effects -->
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feGaussianBlur stdDeviation="5" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueDrop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001a7a" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#29d8ff" flood-opacity="0.38"/>
    </filter>
    <filter id="shellDrop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#052a90" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d7f7ff" flood-opacity="0.8"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="visorClip">
      <path d="M343 420 C386 391 438 409 478 420 C500 426 524 426 546 420 C588 408 640 390 681 420 C716 446 727 492 719 535 C711 579 679 611 634 612 C594 613 567 598 541 595 C522 593 501 593 482 595 C456 598 428 614 388 612 C342 610 312 578 305 534 C298 491 309 447 343 420Z"/>
    </clipPath>
    <style><![CDATA[
      #floatBot { transform-origin: 512px 720px; animation: float 4.8s ease-in-out infinite; }
      #bodyGroup { transform-origin: 512px 820px; animation: breathe 4.8s ease-in-out infinite; }
      #leftArm { transform-box: fill-box; transform-origin: 86% 16%; animation: leftArm 3.9s ease-in-out infinite; }
      #rightArm { transform-box: fill-box; transform-origin: 14% 16%; animation: rightArm 3.9s ease-in-out infinite; }
      #leftEar { transform-box: fill-box; transform-origin: 72% 90%; animation: leftEar 5.6s ease-in-out infinite; }
      #rightEar { transform-box: fill-box; transform-origin: 28% 90%; animation: rightEar 5.6s ease-in-out infinite; }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.8s linear infinite, eyePulse 2.1s ease-in-out infinite; }
      #eyeSparkL { animation: sparkle 2.5s ease-in-out infinite; }
      #eyeSparkR { animation: sparkle 2.5s ease-in-out .7s infinite; }
      #chestGlow { animation: chestPulse 2.8s ease-in-out infinite; }
      #dMark { transform-box: fill-box; transform-origin: center; animation: dPulse 2.8s ease-in-out infinite; }
      #thrusterCore { transform-box: fill-box; transform-origin: 50% 0%; animation: thruster 1.15s ease-in-out infinite; }
      #thrusterHalo { animation: halo 1.15s ease-in-out infinite; }
      #topSpark1 { animation: sparkle 2.2s ease-in-out infinite; }
      #topSpark2 { animation: sparkle 2.8s ease-in-out .8s infinite; }
      #topSpark3 { animation: sparkle 2.4s ease-in-out 1.4s infinite; }

      @keyframes float {
        0%,100% { transform: translateY(0) rotate(-0.35deg); }
        50% { transform: translateY(-18px) rotate(0.55deg); }
      }
      @keyframes breathe {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.008,1.012); }
      }
      @keyframes leftArm {
        0%,100% { transform: rotate(2deg); }
        50% { transform: rotate(-8deg); }
      }
      @keyframes rightArm {
        0%,100% { transform: rotate(-2deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes leftEar {
        0%,100% { transform: rotate(-1deg); }
        50% { transform: rotate(-4deg); }
      }
      @keyframes rightEar {
        0%,100% { transform: rotate(1deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes blink {
        0%, 43%, 46%, 48%, 100% { transform: scaleY(1); }
        44%, 47% { transform: scaleY(0.08); }
      }
      @keyframes eyePulse {
        0%,100% { opacity: .92; filter: brightness(1); }
        50% { opacity: 1; filter: brightness(1.24); }
      }
      @keyframes shine {
        0%,100% { transform: translateX(-80px); opacity: .22; }
        48% { opacity: .55; }
        60% { transform: translateX(390px); opacity: .08; }
      }
      @keyframes chestPulse {
        0%,100% { opacity: .28; }
        50% { opacity: .75; }
      }
      @keyframes dPulse {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      @keyframes thruster {
        0%,100% { transform: scaleY(.92) scaleX(.96); opacity: .92; }
        50% { transform: scaleY(1.08) scaleX(1.03); opacity: 1; }
      }
      @keyframes halo {
        0%,100% { opacity: .20; transform: scale(.92); }
        50% { opacity: .48; transform: scale(1.08); }
      }
      @keyframes sparkle {
        0%,100% { opacity: .25; transform: scale(.7); }
        50% { opacity: 1; transform: scale(1.25); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>
  <!-- soft hovering shadow -->
  <ellipse cx="512" cy="1236" rx="178" ry="31" fill="#0e52ff" opacity="0.22" filter="url(#shadow)"/>
  <ellipse cx="512" cy="1230" rx="118" ry="16" fill="#4cecff" opacity="0.18" filter="url(#shadow)"/>
  <g id="floatBot">
    <!-- EARS -->
    <g id="leftEar" filter="url(#blueDrop)">
      <path d="M283 389 C268 331 269 257 289 224 C301 204 321 210 349 226 C384 246 423 283 453 321 C436 350 408 378 377 400 C340 426 300 424 283 389Z" fill="url(#earBlue)" stroke="#4ba8ff" stroke-width="3"/>
      <path d="M309 350 C299 308 304 262 319 244 C332 229 350 246 374 266 C403 291 423 315 436 337 C420 353 402 373 379 385 C347 403 319 390 309 350Z" fill="url(#earInner)" opacity=".94"/>
      <path d="M291 244 C280 281 282 330 293 361" fill="none" stroke="#ffb4e4" stroke-width="8" stroke-linecap="round" opacity=".54"/>
      <path d="M319 235 C351 249 398 290 430 331" fill="none" stroke="#8cf7ff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </g>
    <g id="rightEar" filter="url(#blueDrop)">
      <path d="M741 389 C756 331 755 257 735 224 C723 204 703 210 675 226 C640 246 601 283 571 321 C588 350 616 378 647 400 C684 426 724 424 741 389Z" fill="url(#earBlue)" stroke="#4ba8ff" stroke-width="3"/>
      <path d="M715 350 C725 308 720 262 705 244 C692 229 674 246 650 266 C621 291 601 315 588 337 C604 353 622 373 645 385 C677 403 705 390 715 350Z" fill="url(#earInner)" opacity=".94"/>
      <path d="M733 244 C744 281 742 330 731 361" fill="none" stroke="#b2c8ff" stroke-width="8" stroke-linecap="round" opacity=".54"/>
      <path d="M705 235 C673 249 626 290 594 331" fill="none" stroke="#8cf7ff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </g>
    <!-- BODY + HEAD -->
    <g id="bodyGroup">
      <!-- arms behind torso -->
      <g id="leftArm" filter="url(#blueDrop)">
        <path d="M326 704 C282 732 241 768 197 802 C182 814 180 835 194 849 C212 868 254 865 290 850 C325 835 350 807 362 775 C370 752 360 720 326 704Z" fill="url(#blueMetalReverse)"/>
        <path d="M321 724 C286 749 253 778 218 806 C203 818 208 837 228 838 C268 841 317 818 340 778 C352 756 347 735 321 724Z" fill="#2a72ff" opacity=".34"/>
        <path d="M205 817 C241 839 301 816 334 777" fill="none" stroke="#8eeeff" stroke-width="6" stroke-linecap="round" opacity=".42"/>
      </g>
      <g id="rightArm" filter="url(#blueDrop)">
        <path d="M698 704 C742 732 783 768 827 802 C842 814 844 835 830 849 C812 868 770 865 734 850 C699 835 674 807 662 775 C654 752 664 720 698 704Z" fill="url(#blueMetal)"/>
        <path d="M703 724 C738 749 771 778 806 806 C821 818 816 837 796 838 C756 841 707 818 684 778 C672 756 677 735 703 724Z" fill="#2a72ff" opacity=".34"/>
        <path d="M819 817 C783 839 723 816 690 777" fill="none" stroke="#8eeeff" stroke-width="6" stroke-linecap="round" opacity=".42"/>
      </g>
      <!-- lower body shell -->
      <path d="M347 671 C389 646 635 646 677 671 C707 689 714 738 707 804 L687 967 C678 1034 614 1090 512 1090 C410 1090 346 1034 337 967 L317 804 C310 738 317 689 347 671Z" fill="url(#shellShade)" stroke="#8bb8ff" stroke-width="3" filter="url(#shellDrop)"/>
      <!-- blue waist belt -->
      <path d="M330 861 C379 888 645 888 694 861 L687 926 C635 954 389 954 337 926Z" fill="url(#blueMetal)" stroke="#1cd0ff" stroke-width="2"/>
      <path d="M342 880 C394 902 630 902 682 880" fill="none" stroke="#8ff3ff" stroke-width="8" opacity=".58"/>
      <!-- lower white pod -->
      <path d="M353 923 C403 949 621 949 671 923 L656 986 C643 1042 588 1076 512 1076 C436 1076 381 1042 368 986Z" fill="url(#shellShade)"/>
      <path d="M384 1006 C425 1047 599 1047 640 1006" fill="none" stroke="#d8f8ff" stroke-width="8" stroke-linecap="round" opacity=".64"/>
      <ellipse cx="512" cy="1043" rx="84" ry="21" fill="#66e8ff" opacity=".23" filter="url(#smallGlow)"/>
      <!-- chest panel -->
      <path d="M370 759 C400 730 624 730 654 759 C671 776 674 836 655 860 C627 895 397 895 369 860 C350 836 353 776 370 759Z" fill="url(#blueMetalReverse)" stroke="#0bd5ff" stroke-width="3" filter="url(#blueDrop)"/>
      <path d="M391 775 C436 758 588 758 633 775" fill="none" stroke="#87f0ff" stroke-width="7" stroke-linecap="round" opacity=".43"/>
      <ellipse id="chestGlow" cx="512" cy="824" rx="112" ry="58" fill="#14d8ff" opacity=".34" filter="url(#softGlow)"/>
      <g id="dMark" filter="url(#smallGlow)">
        <path fill="#ffffff" fill-rule="evenodd" d="M468 764 H529 C591 764 622 789 622 824 C622 859 591 884 529 884 H468 Z M501 790 V858 H527 C566 858 587 845 587 824 C587 803 566 790 527 790 Z"/>
        <path d="M473 771 H526 C577 771 605 790 611 816" fill="none" stroke="#c7f7ff" stroke-width="5" stroke-linecap="round" opacity=".75"/>
      </g>
      <!-- head main shell -->
      <path d="M329 333 C375 295 649 295 695 333 C747 376 768 455 758 539 C750 611 717 674 666 704 C614 734 410 734 358 704 C307 674 274 611 266 539 C256 455 277 376 329 333Z" fill="url(#shell)" stroke="#89b7ff" stroke-width="3" filter="url(#shellDrop)"/>
      <!-- forehead tab -->
      <path d="M475 316 C486 307 538 307 549 316 L547 348 C544 376 528 385 512 385 C496 385 480 376 477 348Z" fill="url(#blueMetal)" stroke="#135cff" stroke-width="2"/>
      <path d="M489 322 C502 317 522 317 535 322" fill="none" stroke="#84f2ff" stroke-width="5" stroke-linecap="round" opacity=".6"/>
      <!-- visor rim -->
      <path d="M336 404 C385 371 437 387 479 400 C500 406 524 406 545 400 C589 387 640 372 688 404 C731 433 746 487 736 540 C726 597 689 635 636 636 C592 637 560 620 537 617 C520 615 504 615 487 617 C464 620 432 637 388 636 C335 635 298 597 288 540 C278 487 293 433 336 404Z" fill="url(#blueMetal)" stroke="#54e7ff" stroke-width="5"/>
      <path d="M343 420 C386 391 438 409 478 420 C500 426 524 426 546 420 C588 408 640 390 681 420 C716 446 727 492 719 535 C711 579 679 611 634 612 C594 613 567 598 541 595 C522 593 501 593 482 595 C456 598 428 614 388 612 C342 610 312 578 305 534 C298 491 309 447 343 420Z" fill="url(#visor)" stroke="#0aaeff" stroke-width="3"/>
      <!-- visor internal glow -->
      <ellipse cx="512" cy="502" rx="184" ry="97" fill="#0056ff" opacity=".16" filter="url(#softGlow)" clip-path="url(#visorClip)"/>
      <path d="M355 430 C420 398 465 442 525 426 C578 411 627 388 679 427" fill="none" stroke="#67dcff" stroke-width="7" stroke-linecap="round" opacity=".38" clip-path="url(#visorClip)"/>
      <path d="M536 441 C581 416 633 408 677 438 C651 438 626 453 607 471 C581 468 555 458 536 441Z" fill="#d7f8ff" opacity=".55" clip-path="url(#visorClip)"/>
      <!-- moving visor shine -->
      <g id="visorShine" clip-path="url(#visorClip)" opacity=".42">
        <rect x="276" y="390" width="54" height="255" rx="27" fill="url(#cyanGlow)" transform="rotate(18 303 518)"/>
      </g>
      <!-- eyes -->
      <g id="leftEye" class="eye" filter="url(#eyeGlow)">
        <circle cx="425" cy="505" r="38" fill="url(#eye)"/>
        <circle cx="414" cy="493" r="10" fill="#ffffff" opacity=".86"/>
        <ellipse cx="425" cy="518" rx="28" ry="12" fill="#00beff" opacity=".26"/>
      </g>
      <g id="rightEye" class="eye" filter="url(#eyeGlow)">
        <circle cx="599" cy="505" r="38" fill="url(#eye)"/>
        <circle cx="588" cy="493" r="10" fill="#ffffff" opacity=".86"/>
        <ellipse cx="599" cy="518" rx="28" ry="12" fill="#00beff" opacity=".26"/>
      </g>
      <circle id="eyeSparkL" cx="477" cy="485" r="3.7" fill="#3ff5ff" filter="url(#smallGlow)"/>
      <circle id="eyeSparkR" cx="535" cy="478" r="3.3" fill="#3ff5ff" filter="url(#smallGlow)"/>
      <circle cx="505" cy="466" r="2" fill="#bafcff" opacity=".7"/>
      <circle cx="551" cy="513" r="2" fill="#bafcff" opacity=".58"/>
      <!-- chin / smile band -->
      <path d="M286 584 C326 668 393 700 512 700 C631 700 698 668 738 584 C729 644 701 694 657 718 C603 747 421 747 367 718 C323 694 295 644 286 584Z" fill="url(#blueMetal)"/>
      <path d="M300 619 C345 686 414 711 512 711 C610 711 679 686 724 619" fill="none" stroke="#53ecff" stroke-width="8" opacity=".65"/>
      <path d="M323 655 C374 699 435 716 512 716 C589 716 650 699 701 655" fill="none" stroke="#eaffff" stroke-width="3" opacity=".5"/>
      <!-- shell highlights -->
      <path d="M309 390 C284 436 282 500 294 548" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".5"/>
      <path d="M697 366 C724 405 739 454 737 495" fill="none" stroke="#d8f8ff" stroke-width="7" stroke-linecap="round" opacity=".48"/>
      <path d="M389 337 C450 314 572 314 635 337" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".62"/>
      <path d="M365 725 C405 744 619 744 659 725" fill="none" stroke="#d7f8ff" stroke-width="5" opacity=".55"/>
      <!-- top micro sparkles -->
      <circle id="topSpark1" cx="404" cy="350" r="3" fill="#8effff" filter="url(#smallGlow)"/>
      <circle id="topSpark2" cx="641" cy="365" r="2.8" fill="#8effff" filter="url(#smallGlow)"/>
      <circle id="topSpark3" cx="576" cy="331" r="2.4" fill="#ffffff" filter="url(#smallGlow)"/>
    </g>
    <!-- THRUSTER -->
    <g id="thrusterGroup" filter="url(#softGlow)">
      <path d="M446 1072 C460 1051 564 1051 578 1072 C589 1089 571 1114 551 1128 C534 1140 490 1140 473 1128 C453 1114 435 1089 446 1072Z" fill="url(#blueMetal)" stroke="#51eaff" stroke-width="3"/>
      <path id="thrusterCore" d="M468 1110 C483 1093 541 1093 556 1110 C571 1128 557 1168 540 1191 C530 1204 494 1204 484 1191 C467 1168 453 1128 468 1110Z" fill="url(#thruster)" stroke="#7af6ff" stroke-width="3"/>
      <path d="M486 1118 C496 1108 528 1108 538 1118 C546 1128 536 1161 526 1175 C520 1183 504 1183 498 1175 C488 1161 478 1128 486 1118Z" fill="#e8ffff" opacity=".48"/>
    </g>
  </g>
</svg>