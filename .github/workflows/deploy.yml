name: Deploy to Vercel Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_XBNSPwcit0xkWNJb8CpPq6na
          VERCEL_PROJECT_ID: prj_NQ5l926gtx1ENEkhtn5ruymlZXw4
          VERCEL_PROJECT_NAME: dawnwire-blog
          VERCEL_GIT_REPO_ID: "1310817594"
        run: node scripts/vercel-deploy.mjs