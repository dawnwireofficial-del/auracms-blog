<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Body Scrubs &amp; Treatments</title>
  <desc id="desc">Animated orbit icon with floating particles.</desc>
  <defs>
    <linearGradient id="orbitGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#50E6FF"/>
      <stop offset="50%" stop-color="#5B72FF"/>
      <stop offset="100%" stop-color="#B56CFF"/>
    </linearGradient>
    <radialGradient id="particleGradient">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#7DEBFF"/>
      <stop offset="100%" stop-color="#7358FF"/>
    </radialGradient>
    <linearGradient id="jarGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50E6FF"/>
      <stop offset="55%" stop-color="#5B72FF"/>
      <stop offset="100%" stop-color="#B56CFF"/>
    </linearGradient>
    <linearGradient id="lidGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B56CFF"/>
      <stop offset="100%" stop-color="#7358FF"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5B72FF" flood-opacity=".18"/>
    </filter>
  </defs>

  <g class="orbit-layer orbit-one" transform="rotate(-12 256 256)">
    <ellipse cx="256" cy="256" rx="184" ry="88" fill="none" stroke="url(#orbitGradient)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="205 34 82 50" opacity=".72"/>
    <circle cx="72" cy="256" r="6.5" fill="url(#particleGradient)" filter="url(#softGlow)"/>
    <circle cx="440" cy="256" r="4.5" fill="url(#particleGradient)" filter="url(#softGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="-12 256 256" to="348 256 256" dur="11.1s" begin="-1.05s" repeatCount="indefinite"/>
  </g>

  <g class="orbit-layer orbit-two" transform="rotate(22 256 256)">
    <ellipse cx="256" cy="256" rx="150" ry="116" fill="none" stroke="url(#orbitGradient)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="110 40 55 70" opacity=".45"/>
    <circle cx="256" cy="140" r="4.8" fill="url(#particleGradient)" filter="url(#softGlow)"/>
    <circle cx="256" cy="372" r="3.8" fill="url(#particleGradient)" filter="url(#softGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="22 256 256" to="-338 256 256" dur="15.4s" begin="-2.15s" repeatCount="indefinite"/>
  </g>

  <g class="micro-particles" opacity=".9">
    <circle cx="112" cy="170" r="3.2" fill="#66DFFF">
      <animate attributeName="cy" values="170;160;170" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="402" cy="170" r="4" fill="#A06BFF">
      <animate attributeName="cy" values="170;181;170" dur="4.2s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="4.2s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="132" cy="350" r="2.8" fill="#7EF1FF">
      <animate attributeName="cx" values="132;142;132" dur="3.8s" begin="-.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="382" cy="346" r="3.2" fill="#7A72FF">
      <animate attributeName="cx" values="382;372;382" dur="4.5s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
  </g>

  <g class="icon-float" filter="url(#iconShadow)">
    <g class="icon-breathe">
      <g transform="translate(256 256)">
        <rect x="-74" y="-128" width="148" height="30" rx="9" fill="url(#lidGradient)"/>
        <rect x="-84" y="-106" width="168" height="16" rx="8" fill="url(#lidGradient)"/>
        <path d="M -100 -90 C -100 -90 -110 -38 -110 12 C -110 72 -90 112 -62 128 C -21 154 21 154 62 128 C 90 112 110 72 110 12 C 110 -38 100 -90 100 -90 Z" fill="url(#jarGradient)"/>
        <rect x="-86" y="-34" width="172" height="78" rx="8" fill="#ffffff" opacity=".92"/>
        <circle cx="-42" cy="6" r="8" fill="#B56CFF" opacity=".85"/>
        <circle cx="4" cy="16" r="8" fill="#5B72FF" opacity=".85"/>
        <circle cx="46" cy="6" r="8" fill="#50E6FF" opacity=".85"/>
        <rect x="-46" y="-22" width="92" height="9" rx="4.5" fill="#7A72FF" opacity=".75"/>
        <rect x="-62" y="30" width="124" height="9" rx="4.5" fill="#7A72FF" opacity=".5"/>
        <circle cx="-56" cy="-96" r="6" fill="#ffffff" opacity=".55"/>
        <circle cx="72" cy="16" r="4" fill="#ffffff" opacity=".6"/>
        <circle cx="-70" cy="60" r="3" fill="#ffffff" opacity=".5"/>
      </g>
      <animateTransform attributeName="transform" type="scale" values="1;1.018;1" dur="6.8s" begin="-0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4.8s" begin="-1.05s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </g>

  <style>
    .orbit-layer { transform-box: fill-box; transform-origin: center; }
    .icon-breathe { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>
</svg>
