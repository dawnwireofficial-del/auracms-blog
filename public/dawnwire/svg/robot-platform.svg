<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" aria-hidden="true">
  <defs>
    <radialGradient id="beam"><stop stop-color="#5EEBFF" stop-opacity=".65"/><stop offset=".32" stop-color="#6F72FF" stop-opacity=".25"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".25" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".7" stop-color="#86A4FF" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .pulse1{animation:pulse1 3s ease-in-out infinite;transform-origin:310px 153px}.pulse2{animation:pulse2 3s ease-in-out infinite .35s;transform-origin:310px 153px}.beam{animation:beam 2.2s ease-in-out infinite}@keyframes pulse1{0%,100%{transform:scale(.92);opacity:.62}50%{transform:scale(1.04);opacity:1}}@keyframes pulse2{0%,100%{transform:scale(.88);opacity:.36}50%{transform:scale(1.09);opacity:.72}}@keyframes beam{0%,100%{opacity:.58}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse class="beam" cx="310" cy="150" rx="185" ry="75" fill="url(#beam)"/>
  <ellipse class="pulse2" cx="310" cy="159" rx="240" ry="60" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <ellipse class="pulse1" cx="310" cy="153" rx="170" ry="42" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="310" cy="150" rx="76" ry="19" fill="#77EBFF" fill-opacity=".20" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2"/>
</svg>
