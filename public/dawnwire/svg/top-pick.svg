<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img" aria-labelledby="title desc">
  <title id="title">Top pick rating card</title><desc id="desc">Animated rating card showing 4.8 stars based on 12,862 reviews.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".86"/><stop offset="1" stop-color="#EEF3FF" stop-opacity=".52"/></linearGradient>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="210%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#35519A" flood-opacity=".16"/></filter>
  </defs>
  <style>
    .stars g{transform-origin:center;animation:pop 3s ease-in-out infinite}.stars g:nth-child(2){animation-delay:.12s}.stars g:nth-child(3){animation-delay:.24s}.stars g:nth-child(4){animation-delay:.36s}.stars g:nth-child(5){animation-delay:.48s}.badge{animation:badge 3.4s ease-in-out infinite;transform-origin:290px 114px}@keyframes pop{0%,30%,100%{transform:scale(1)}45%{transform:scale(1.18)}}@keyframes badge{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g filter="url(#shadow)"><rect x="9" y="9" width="322" height="172" rx="30" fill="url(#glass)"/></g>
  <text x="28" y="45" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#41577F">Top Pick</text>
  <text x="28" y="100" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#12316A">4.8</text>
  <g class="stars" transform="translate(30 66)">
    <g><path d="M12.5 0l3.8 7.7 8.5 1.3-6.2 6 1.5 8.4-7.6-4-7.6 4 1.5-8.4-6.2-6 8.5-1.3z" fill="#5B4BFF"/></g>
    <g transform="translate(25 0)"><path d="M12.5 0l3.8 7.7 8.5 1.3-6.2 6 1.5 8.4-7.6-4-7.6 4 1.5-8.4-6.2-6 8.5-1.3z" fill="#5B4BFF"/></g>
    <g transform="translate(50 0)"><path d="M12.5 0l3.8 7.7 8.5 1.3-6.2 6 1.5 8.4-7.6-4-7.6 4 1.5-8.4-6.2-6 8.5-1.3z" fill="#5B4BFF"/></g>
    <g transform="translate(75 0)"><path d="M12.5 0l3.8 7.7 8.5 1.3-6.2 6 1.5 8.4-7.6-4-7.6 4 1.5-8.4-6.2-6 8.5-1.3z" fill="#5B4BFF"/></g>
    <g transform="translate(100 0)"><path d="M12.5 0l3.8 7.7 8.5 1.3-6.2 6 1.5 8.4-7.6-4-7.6 4 1.5-8.4-6.2-6 8.5-1.3z" fill="#5B4BFF"/></g>
  </g>
  <text x="28" y="134" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#6E7FA2">Based on 12,862 Reviews</text>
  <g class="badge"><rect x="261" y="84" width="59" height="59" rx="18" fill="#F7FAFF" stroke="#FFFFFF"/><path d="M291 97l5.8 11.7 13 1.9-9.4 9.2 2.2 13-11.6-6.1-11.6 6.1 2.2-13-9.4-9.2 13-1.9z" fill="none" stroke="#5B4BFF" stroke-width="2.8" stroke-linejoin="round"/></g>
</svg>