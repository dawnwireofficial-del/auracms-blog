<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img" aria-labelledby="title desc">
  <title id="title">Price drops card</title><desc id="desc">Animated line chart showing price drops today up to 35 percent.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".86"/><stop offset="1" stop-color="#EEF3FF" stop-opacity=".52"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3C7BFF" stop-opacity=".28"/><stop offset="1" stop-color="#3C7BFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="210%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#35519A" flood-opacity=".16"/></filter>
  </defs>
  <style>
    .line{stroke-dasharray:290;stroke-dashoffset:290;animation:draw 3.4s ease-in-out infinite}.dot{animation:blink 2.1s ease-in-out infinite}.arrow{animation:bob 2.6s ease-in-out infinite;transform-origin:292px 72px}@keyframes draw{0%,10%{stroke-dashoffset:290}50%,100%{stroke-dashoffset:0}}@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
  </style>
  <g filter="url(#shadow)"><rect x="9" y="9" width="322" height="192" rx="30" fill="url(#glass)"/></g>
  <text x="28" y="43" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#41577F">Price Drops Today</text>
  <text x="28" y="70" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#6E7FA2">Up to 35% Off</text>
  <g class="arrow"><circle cx="292" cy="70" r="23" fill="#F5F8FF" stroke="#FFFFFF"/><path d="M292 56v24m0 0l-8-8m8 8l8-8" fill="none" stroke="#5B4BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M31 166L56 146 76 153 98 130 121 143 145 112 169 127 192 98 218 118 242 84 269 101 304 70V176H31z" fill="url(#area)"/>
  <path class="line" d="M31 166L56 146 76 153 98 130 121 143 145 112 169 127 192 98 218 118 242 84 269 101 304 70" fill="none" stroke="#3C7BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#3C7BFF" stroke-width="3"><circle class="dot" cx="31" cy="166" r="5"/><circle class="dot" cx="98" cy="130" r="5"/><circle class="dot" cx="145" cy="112" r="5"/><circle class="dot" cx="192" cy="98" r="5"/><circle class="dot" cx="242" cy="84" r="5"/><circle class="dot" cx="304" cy="70" r="5"/></g>
</svg>