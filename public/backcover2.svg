<svg width="1440" height="800" viewBox="0 0 1440 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="800" fill="url(#bg-gradient2)" />
  <defs>
    <linearGradient id="bg-gradient2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2A5C" />
      <stop offset="50%" stop-color="#0A1F44" />
      <stop offset="100%" stop-color="#08152E" />
    </linearGradient>
  </defs>
  <!-- Grid dots pattern -->
  <g opacity="0.08">
    <circle cx="100" cy="100" r="2" fill="white" />
    <circle cx="300" cy="100" r="2" fill="white" />
    <circle cx="500" cy="100" r="2" fill="white" />
    <circle cx="700" cy="100" r="2" fill="white" />
    <circle cx="900" cy="100" r="2" fill="white" />
    <circle cx="1100" cy="100" r="2" fill="white" />
    <circle cx="1300" cy="100" r="2" fill="white" />
    <circle cx="200" cy="300" r="2" fill="white" />
    <circle cx="400" cy="300" r="2" fill="white" />
    <circle cx="600" cy="300" r="2" fill="white" />
    <circle cx="800" cy="300" r="2" fill="white" />
    <circle cx="1000" cy="300" r="2" fill="white" />
    <circle cx="1200" cy="300" r="2" fill="white" />
    <circle cx="1400" cy="300" r="2" fill="white" />
    <circle cx="100" cy="500" r="2" fill="white" />
    <circle cx="300" cy="500" r="2" fill="white" />
    <circle cx="500" cy="500" r="2" fill="white" />
    <circle cx="700" cy="500" r="2" fill="white" />
    <circle cx="900" cy="500" r="2" fill="white" />
    <circle cx="1100" cy="500" r="2" fill="white" />
    <circle cx="1300" cy="500" r="2" fill="white" />
    <circle cx="200" cy="700" r="2" fill="white" />
    <circle cx="400" cy="700" r="2" fill="white" />
    <circle cx="600" cy="700" r="2" fill="white" />
    <circle cx="800" cy="700" r="2" fill="white" />
    <circle cx="1000" cy="700" r="2" fill="white" />
    <circle cx="1200" cy="700" r="2" fill="white" />
    <circle cx="1400" cy="700" r="2" fill="white" />
  </g>
  <!-- Glowing orbs -->
  <circle cx="1200" cy="150" r="280" fill="#FF8A00" opacity="0.06" filter="url(#blur2)" />
  <circle cx="300" cy="500" r="250" fill="#246BFF" opacity="0.08" filter="url(#blur2)" />
  <defs>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="80" />
