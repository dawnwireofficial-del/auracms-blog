<svg width="1440" height="800" viewBox="0 0 1440 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="800" fill="url(#bg-gradient)" />
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F44" />
      <stop offset="50%" stop-color="#08152E" />
      <stop offset="100%" stop-color="#0D2A5C" />
    </linearGradient>
  </defs>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="200" x2="1440" y2="200" stroke="white" stroke-width="0.5" />
    <line x1="0" y1="400" x2="1440" y2="400" stroke="white" stroke-width="0.5" />
    <line x1="0" y1="600" x2="1440" y2="600" stroke="white" stroke-width="0.5" />
    <line x1="360" y1="0" x2="360" y2="800" stroke="white" stroke-width="0.5" />
    <line x1="720" y1="0" x2="720" y2="800" stroke="white" stroke-width="0.5" />
    <line x1="1080" y1="0" x2="1080" y2="800" stroke="white" stroke-width="0.5" />
  </g>
  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="250" fill="#246BFF" opacity="0.08" filter="url(#blur)" />
  <circle cx="1100" cy="400" r="300" fill="#FF8A00" opacity="0.05" filter="url(#blur)" />
  <circle cx="700" cy="650" r="200" fill="#246BFF" opacity="0.06" filter="url(#blur)" />
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>
</svg>
